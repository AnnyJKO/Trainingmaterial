<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隱形風暴：部門危機的決策考驗</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --text-main: #1e293b;
            --text-light: #64748b;
            --accent-color: #0f172a;
            --primary-color: #2563eb;
            --card-bg: #ffffff;
            --border-radius: 16px;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --highlight: #f0f9ff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        #web-container {
            width: 100%;
            max-width: 1000px;
            min-height: 100vh;
            background-color: var(--card-bg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        @media (min-width: 1024px) {
            #web-container {
                min-height: 92vh;
                margin: 30px 0;
                border-radius: 24px;
                overflow: hidden;
            }
        }

        #top-nav {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        #top-nav.active { display: flex; }
        #back-btn {
            color: var(--text-light);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        #back-btn:hover { color: var(--accent-color); background-color: #f1f5f9; }
        #nav-title { font-weight: 700; color: var(--text-main); font-size: 18px; letter-spacing: 1px; }

        .fade-in { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .screen {
            display: none;
            flex-direction: column;
            padding: 50px 70px;
            box-sizing: border-box;
            flex-grow: 1;
        }
        .screen.active { display: flex; }

        #home-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }

        .home-title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        .pixel-icon {
            font-size: 38px;
            line-height: 1;
            user-select: none;
        }
        .serif-title {
            font-family: "Noto Serif TC", "Source Han Serif TC", "Times New Roman", Times, serif;
            font-size: 48px;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 3px;
        }

        .subtitle { color: var(--text-light); font-size: 19px; margin-bottom: 60px; line-height: 1.8; max-width: 650px; }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 20px;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }
        .btn-primary:hover { background-color: #1d4ed8; transform: translateY(-3px); box-shadow: 0 15px 35px rgba(37, 99, 235, 0.4); }

        .header {
            font-size: 14px;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 16px;
            font-weight: 800;
        }

        .pixel-banner {
            width: 100%;
            height: 160px;
            background-color: #0f172a;
            border-radius: 16px;
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 4px solid #1e293b;
        }
        .pixel-art {
            font-family: monospace;
            font-size: 28px;
            line-height: 1.2;
            letter-spacing: 4px;
            text-align: center;
            user-select: none;
        }
        .pixel-label {
            margin-top: 10px;
            font-size: 13px;
            font-weight: bold;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .story-text { font-size: 18px; line-height: 1.8; margin-bottom: 24px; color: #334155; }
        
        .dialogue-box {
            background-color: #f8fafc;
            padding: 26px 32px;
            border-radius: var(--border-radius);
            margin-bottom: 28px;
            border-left: 5px solid var(--accent-color);
            font-size: 17px;
            line-height: 1.7;
        }

        #choices-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        .choice-btn {
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            padding: 24px 32px;
            border-radius: var(--border-radius);
            font-size: 17px;
            color: #475569;
            text-align: left;
            cursor: pointer;
            line-height: 1.6;
            transition: all 0.2s ease;
        }
        .choice-btn:hover { border-color: var(--primary-color); transform: translateX(5px); background-color: #f8fafc; }
        .choice-btn b { color: var(--accent-color); display: block; margin-bottom: 10px; font-size: 19px; }

        .selected-choice-review {
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
            border: 2px solid #cbd5e1;
            font-size: 18px;
            line-height: 1.6;
            color: #334155;
            position: relative;
        }
        .selected-choice-review::before {
            content: '📌 你的決策';
            position: absolute;
            top: -14px;
            left: 20px;
            background: #fff;
            padding: 0 10px;
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-color);
            border-radius: 20px;
            border: 1px solid #cbd5e1;
        }
        .selected-choice-review strong {
            color: var(--accent-color);
            font-size: 20px;
            display: block;
            margin-bottom: 8px;
        }

        .feedback-box {
            background-color: #fff;
            padding: 32px;
            border-radius: var(--border-radius);
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }
        .feedback-title { font-weight: bold; margin-bottom: 20px; font-size: 22px; }
        .danger { border-top: 6px solid var(--danger); }
        .danger .feedback-title { color: var(--danger); }
        .warning { border-top: 6px solid var(--warning); }
        .warning .feedback-title { color: var(--warning); }
        .success { border-top: 6px solid var(--success); }
        .success .feedback-title { color: var(--success); }

        .mitigation-box {
            background-color: var(--highlight);
            border-left: 6px solid #0284c7;
            padding: 32px;
            margin-bottom: 40px;
            border-radius: 0 16px 16px 0;
            font-size: 17px;
            line-height: 1.8;
            color: #0f172a;
        }
        .mitigation-box b { color: #0284c7; display: block; margin-bottom: 16px; font-size: 19px; }

        .score-board {
            text-align: center;
            padding: 40px;
            background: var(--accent-color);
            color: white;
            border-radius: 20px;
            margin-bottom: 30px;
        }
        .rank-badge {
            display: inline-block;
            padding: 10px 24px;
            background: var(--primary-color);
            border-radius: 30px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 15px;
        }

        .ending-story {
            background-color: #f8fafc;
            padding: 30px;
            border-radius: 16px;
            margin-top: 24px;
            border-left: 4px solid var(--text-light);
            font-size: 17px;
            line-height: 1.8;
        }
        .ending-story h4 { margin-top: 0; margin-bottom: 16px; color: var(--accent-color); font-size: 20px; font-weight: 800;}
        .ending-story p { margin-bottom: 16px; }
        .ending-story p:last-child { margin-bottom: 0; }

        /* 歷程記錄樣式 */
        .history-review-box {
            background-color: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            padding: 30px;
            margin-top: 24px;
            text-align: left;
        }
        .history-review-box h4 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .history-item {
            margin-bottom: 16px;
            font-size: 16px;
            line-height: 1.6;
        }
        .history-item:last-child { margin-bottom: 0; }
        .history-phase {
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 4px;
            display: block;
        }
        .history-choice-text {
            color: #334155;
            background-color: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #cbd5e1;
        }

        /* 置中、字級優化（14px 較小字體）、優雅襯線體的感謝與警語排版 */
        .ending-footer-section {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid #cbd5e1;
            text-align: center;
        }
        .footer-serif-text {
            font-family: "Noto Serif TC", "Source Han Serif TC", "Times New Roman", Times, serif;
            font-size: 17px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .footer-disclaimer-text {
            font-family: "Noto Serif TC", "Source Han Serif TC", "Times New Roman", Times, serif;
            font-size: 14px;
            font-weight: 400;
            color: #64748b;
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="web-container">
        <div id="top-nav">
            <div id="back-btn" onclick="goBack()">◀ 回上一步</div>
            <div id="nav-title">隱形風暴：管理決策模擬器</div>
            <div style="width: 70px;"></div>
        </div>

        <div id="home-screen" class="screen active fade-in">
            <div class="home-title-container">
                <span class="pixel-icon">💡</span>
                <h1 class="serif-title">隱形風暴</h1>
                <span class="pixel-icon">⚖️</span>
            </div>
            <div class="subtitle">職場霸凌模擬案例<br><br>每個選項都有副作用，你會怎麼做？</div>
            <button class="btn-primary" onclick="startGame()">開始推演</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="header" id="phase-title">加載中...</div>
            <div id="story-container"></div>
            <div id="choices-container"></div>
        </div>
    </div>

    <script>
        let historyStack = [];
        let currentNodeId = 'home';
        let userChoices = {};

        const gameData = {
            phase1_intro: {
                title: "PHASE 1 : 殘缺交付與向上升級",
                pixelArt: `
                    <div class="pixel-art">📂 💻 ⚡ 📄 ❌</div>
                    <div class="pixel-label">【 數據交接障礙・資料缺漏衝突 】</div>
                `,
                story: `
                    <div class="story-text">阿泰是新進資深員工，負責推動流程優化專案，需要部門老臣「老軒」提供歷史數據。</div>
                    <div class="story-text">老軒表面配合，但寄來的檔案缺漏百出、格式全亂。阿泰請老軒重新整理，老軒推託：「系統匯出來就是這樣，我最近客戶專案滿載，真的沒空幫你手工洗數據。」</div>
                    <div class="story-text">來回拉扯一個月，專案根本無法進行。阿泰敲了你的辦公室門：</div>
                    <div class="dialogue-box">
                        <b>阿泰：</b><br>「主管，這專案推不動。老軒一直給殘缺資料，請他補齊就說很忙。沒有乾淨的數據，專案絕對開天窗，請你協助。」
                    </div>
                    <div class="story-text">你詢問老軒，老軒卻一臉無辜：</div>
                    <div class="dialogue-box">
                        <b>老軒：</b><br>「主管，我絕對全力配合啊！資料我第一天就給他了。他身為專案負責人，自己不具備整併資料的能力，怎麼反而怪我不幫他做苦工？」
                    </div>
                    <div class="story-text">面對阿泰的求救與老軒的「反咬一口」，身為主管，第一步該怎麼做？</div>
                `,
                choices: [
                    { phase: 1, points: 10, text: "<b>【機會教育】給予阿泰磨練機會</b><br>告訴阿泰：跨部門溝通與資料整併是專案負責人的重要能力，請他先試著將現有資料進行清洗。", next: "phase1_resultA" },
                    { phase: 1, points: 25, text: "<b>【明確死線】要求老軒以大局為重</b><br>找兩人開會，要求老軒於截止日前提供符合專案所需格式的完整數據給阿泰。", next: "phase1_resultB" },
                    { phase: 1, points: 5,  text: "<b>【主管支援】親自下場協助溝通</b><br>請阿泰列出缺漏清單，由主管我本人親自去和老軒拿資料來做，跳下去加速推進。", next: "phase1_resultC" }
                ]
            },
            phase1_resultA: {
                title: "決策副作用",
                story: `
                    <div class="feedback-box danger"><div class="feedback-title">⚠️ 落入老臣的卸責陷阱</div><div class="story-text">阿泰覺得主管在包庇老鳥。老軒則確認了「只要隨便丟資料交差，主管就會買單」。阿泰熬夜硬洗數據引發更多錯誤，專案進度落後。</div></div>
                    <div class="mitigation-box"><b>解析：給予弱勢同事更多協助</b>處於弱勢的同事已明示向主管舉手求救，主管應提供更多協助。面對同事推卸責任來掩飾不作為，主管可以透過訂出透明的流程及標準（或者員工與主管的共用頻道）來減低衝突。</div>
                `,
                choices: [{ text: "進入 PHASE 2：隱性排擠", next: "phase2_intro" }]
            },
            phase1_resultB: {
                title: "決策副作用",
                story: `
                    <div class="feedback-box warning"><div class="feedback-title">⚠️ 惡意配合</div><div class="story-text">老軒表面答應，週五交了一份「格式全對但邏輯全錯」的報表，逢人便說：「主管逼我做白工」。阿泰拿到後依然無法使用。</div></div>
                    <div class="mitigation-box"><b>解析：給予弱勢同事更多協助</b>處於弱勢的同事已明示向主管舉手求救，主管應提供更多協助。面對同事推卸責任來掩飾不作為，主管可以透過訂出透明的流程及標準（或者員工與主管的共用頻道）來減低衝突。</div>
                `,
                choices: [{ text: "進入 PHASE 2：隱性排擠", next: "phase2_intro" }]
            },
            phase1_resultC: {
                title: "決策副作用",
                story: `
                    <div class="feedback-box danger"><div class="feedback-title">⚠️ 主管降級為高級秘書</div><div class="story-text">專案暫時得救，但老軒發現「只要為難新人，主管就會把新人換掉」；阿泰則覺得任務被剝奪，喪失了主管的信任，心情委屈又沮喪。</div></div>
                    <div class="mitigation-box"><b>解析：給予弱勢同事更多協助</b>處於弱勢的同事已明示向主管舉手求救，主管應提供更多協助。面對同事推卸責任來掩飾不作為，主管可以透過訂出透明的流程及標準（或者員工與主管的共用頻道）來減低衝突。</div>
                `,
                choices: [{ text: "進入 PHASE 2：隱性排擠", next: "phase2_intro" }]
            },

            phase2_intro: {
                title: "PHASE 2 : 隱性排擠與冷暴力",
                pixelArt: `
                    <div class="pixel-art">🗣️ 💬 📉 😒 👥</div>
                    <div class="pixel-label">【 會議冷暴力・集體排擠效應 】</div>
                `,
                story: `
                    <div class="story-text">在部門會議上，阿泰發言時，發現老軒時常嘆氣、滑手機，或跟其他同事交換眼神。阿泰覺得其他同事也因此開始孤立他。</div>
                    <div class="story-text">阿泰承受不住，私下找你：</div>
                    <div class="dialogue-box">
                        <b>阿泰：</b><br>「主管，我覺得大家都在針對我。群組發問沒人回，開會大家都用看笑話的眼神看我……我想退出專案，或者請你把我調走。」
                    </div>
                `,
                choices: [
                    { phase: 2, points: 5,  text: "<b>【心理支持】鼓勵阿泰用專業說話</b><br>推動新流程本來就會遇到老員工的防衛心。請他把焦點放在事情上，用專業慢慢贏得信任。", next: "phase2_resultA" },
                    { phase: 2, points: 25, text: "<b>【行為導正】單獨約談點出問題</b><br>單獨約談老軒，直接點出他在會議上的非語言行為（如滑手機、嘆氣）是在針對阿泰，已影響阿泰心情。", next: "phase2_resultB" },
                    { phase: 2, points: 10, text: "<b>【資源調度】調整專案分工</b><br>為保護阿泰身心與進度，請阿泰將原本需要依賴老軒的模組，轉交給另一位擅長溝通的同事負責。", next: "phase2_resultC" }
                ]
            },
            phase2_resultA: {
                title: "決策副作用",
                story: `
                    <div class="feedback-box danger"><div class="feedback-title">⚠️ 受害者有罪論</div><div class="story-text">阿泰解讀為「主管覺得我能力不夠、無法融入團隊」。隔週阿泰直接遞交離職單，並向 HR 控訴你包庇霸凌。</div></div>
                    <div class="mitigation-box"><b>解析：不要爭論動機，直接定調行為界線</b>當同事反映疑似霸凌的狀況，主管應主動介入保護，而非責怪同事抗壓力太低或要他自己堅強。主管可以傾聽並接住情緒，並在後續的會議中，溫和但堅定指正：「老軒，別人報告時我們不滑手機。」</div>
                `,
                choices: [{ text: "進入 PHASE 3：申訴炸彈", next: "phase3_intro" }]
            },
            phase2_resultB: {
                title: "決策副作用",
                story: `
                    <div class="feedback-box warning"><div class="feedback-title">⚠️ 抓不到把柄的狡辯</div><div class="story-text">老軒秒回：「我看手機是回客戶訊息！」隨後在群組暗諷主管搞文字獄偏袒新人，阿泰被更徹底地孤立。</div></div>
                    <div class="mitigation-box"><b>解析：不要爭論動機，直接定調行為界線</b>不需要與當事者爭論動機，可以直接定調行為界線。在團隊會議當下，可以公開、明確地指正行為，讓全團隊看見底線。</div>
                `,
                choices: [{ text: "進入 PHASE 3：申訴炸彈", next: "phase3_intro" }]
            },
            phase2_resultC: {
                title: "決策副作用",

                cssClass = "success";
                desc = "你展現了極高超的管理手腕！從定調行為界線、在法規紅線上完美平衡，到最後用系統重塑協作，成功拔除毒性土壤。";
                scoreExplanation = "分數解析：你在此次演練中獲得高分，因為你在每個關鍵節點都做出了「制度化」與「行為導正」的正確選擇：明確劃定死線、私下約談導正冷暴力、並透過共享資料庫將流程透明化，既保護了人才，也重塑了健康的團隊土壤。";
            } else if (totalScore >= 65) {
                rank = "救火大隊長";
                title = "務實的危機處理者";
                cssClass = "success";
                desc = "你在危機中做出了許多正確的停損，看清問題本質並願意從制度面下手，團隊正往健康路上邁進。";
                scoreExplanation = "分數解析：你獲得中高分數，代表你在面對複雜的職場摩擦時，展現了良好的務實停損能力。雖然過程中可能因為折衷方案（如調組或扛責）付出一點代價，但因為後續導入了正確的透明機制，成功讓團隊止血並步入正軌。";
            } else if (totalScore >= 40) {
                rank = "夾心餅乾";
                title = "疲於奔命的協調者";
                cssClass = "warning";
                desc = "你試圖在老臣與新人之間尋求平衡，但過度妥協讓你失去威信，部門問題只是被暫時掩蓋。";
                scoreExplanation = "分數解析：你獲得中低分數。在這個分數段的演練中，你可能過度依賴「各打五十大板」的協調或暫時調避，雖然維持了表面和諧，但因為沒有從根本上建立透明的考核與協作標準，導致老臣的卡資源問題或新人的委屈未能徹底解決，團隊潛藏隱患。";
            } else {
                rank = "未爆彈製造機";
                title = "毒性文化的溫床";
                cssClass = "danger";
                desc = "決策累積了太多迴避與妥協（如檢討受害者或私下摸頭），導致團隊信任崩解，危機一觸即發。";
                scoreExplanation = "分數解析：你獲得此分數，反映出在多次關鍵決策中偏向了「迴避衝突」或「私下摸頭和解」。這導致受害者心死離職、老臣帶著核心客戶與營收求去，公司面臨勞檢裁罰，團隊也陷入長期低迷與防衛心態。這正是缺乏行為底線與合規程序所付出的沉重代價。";
            }

            return {
                title: "終局評估報告",
                pixelArt: `
                    <div class="pixel-art">🏆 📊 🎯 🌟 📈</div>
                    <div class="pixel-label">【 故事總結・演練報告 】</div>
                `,
                story: `
                    <div class="score-board">
                        <div style="font-size: 16px; opacity: 0.8; margin-bottom: 5px;">總分：${totalScore} / 100 分</div>
                        <div style="font-size: 13px; opacity: 0.7; margin-top: 8px; font-style: italic;">情境純屬虛構，選項故意做得不完美，分數純為有趣，請不要往心裡去。<br>不過，這是真的：在管理難題下，沒有完美的做法，只有較好的選擇。</div>
                        <div class="rank-badge">${rank}</div>
                    </div>
                    <div class="feedback-box ${cssClass}" style="margin-top: 10px;">
                        <div class="feedback-title">${title}</div>
                        <div class="story-text" style="font-size:16px;">${desc}</div>
                        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #cbd5e1; font-size: 15px; line-height: 1.7; color: #334155; text-align: left;">
                            ${scoreExplanation}
                        </div>
                    </div>
                    <div class="ending-story">
                        ${ahTaiEnding ? `<h4>【故事的最終章】</h4>` : ``}
                        <p><b>阿泰：</b>${ahTaiEnding}</p>
                        <p><b>老軒：</b>${laoXuanEnding}</p>
                        <p><b>團隊：</b>${teamEnding}</p>
                    </div>

                    <div class="history-review-box">
                        <h4>📌 你的決策歷程回顧</h4>
                        ${historyHTML}
                    </div>

                    <div class="ending-footer-section">
                        <div class="footer-serif-text">謝謝你全心投入，讓我們一起建立彼此尊重的友善職場文化。</div>
                        <div class="footer-disclaimer-text">
                            🛡️ <b>本案例純屬虛構，解析內容僅供課堂討論，不代表正確答案或唯一的解決方式。</b> 🛡️<br>
                            真實世界中，每個情境都是變化球，需因應實際狀況處理。<br>
                            若你不確定要怎麼辦，歡迎找 HR 或你的主管討論。
                        </div>
                    </div>
                `,
                choices: [
                    { text: "<b>🔄 重新推演</b><br>回到首頁，嘗試不同的決策路線", next: "home" }
                ]
            };
        }

        function startGame() {
            historyStack = [];
            userChoices = {};
            document.getElementById('home-screen').classList.remove('active');
            renderNode('phase1_intro');
        }

        function goBack() {
            if (historyStack.length > 0) {
                const prevNode = historyStack.pop();
                renderNode(prevNode, true);
            }
        }

        function renderNode(nodeId, isBack = false) {
            if (nodeId === 'home') {
                document.getElementById('top-nav').classList.remove('active');
                document.getElementById('game-screen').classList.remove('active');
                document.getElementById('home-screen').classList.add('active');
                currentNodeId = 'home';
                historyStack = [];
                userChoices = {};
                return;
            }

            if (nodeId === 'phase3_intro') {
                preparePhase3();
            }

            if (nodeId === 'phase4_intro') {
                preparePhase4();
            }

            let node;
            if (nodeId === 'final_evaluation') {
                node = generateEnding();
            } else {
                node = gameData[nodeId];
            }
            if (!node) return;

            if (!isBack && currentNodeId !== 'home') {
                historyStack.push(currentNodeId);
            }
            currentNodeId = nodeId;

            document.getElementById('top-nav').classList.add('active');
            document.getElementById('back-btn').style.visibility = historyStack.length > 0 ? 'visible' : 'hidden';

            const gameScreen = document.getElementById('game-screen');
            const storyContainer = document.getElementById('story-container');
            const choicesContainer = document.getElementById('choices-container');
            
            gameScreen.classList.remove('active', 'fade-in');
            void gameScreen.offsetWidth; 
            
            document.getElementById('phase-title').innerText = node.title;
            
            let contentHTML = '';
            
            if (nodeId.includes('_result') && userChoices[nodeId.match(/phase\d/)[0].replace('phase', '')]) {
                const currentPhaseStr = nodeId.match(/phase\d/)[0].replace('phase', '');
                const userChoiceObj = userChoices[currentPhaseStr];
                contentHTML += `
                    <div class="selected-choice-review">
                        <strong>你的決策</strong>
                        ${userChoiceObj.text}
                    </div>
                `;
            }

            if (node.pixelArt) {
                contentHTML += `<div class="pixel-banner">${node.pixelArt}</div>`;
            } else if (nodeId === 'final_evaluation') {
                contentHTML += `<div class="pixel-banner"><div class="pixel-art">🏆 📊 🎯</div><div class="pixel-label">【 故事總結・演練報告 】</div></div>`;
            }

            contentHTML += node.story;
            storyContainer.innerHTML = contentHTML;
            
            choicesContainer.innerHTML = '';
            if (node.choices) {
                node.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerHTML = choice.text;
                    btn.onclick = () => {
                        if (choice.phase) {
                            userChoices[choice.phase] = { 
                                text: choice.text, 
                                points: choice.points 
                            };
                        }
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                        renderNode(choice.next);
                    };
                    choicesContainer.appendChild(btn);
                });
            }

            gameScreen.classList.add('active', 'fade-in');
            window.scrollTo(0, 0); 
        }
    </script>
</body>
</html>
